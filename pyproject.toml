[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "0xgitanalyzer"
version = "0.1.0"
description = "0xGitAnalyzer — open-source GitHub exposure scanner: clone, scan and triage the public footprint of a list of accounts"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["security", "secrets", "github", "osint", "appsec", "supply-chain"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
# Only needed for the Anthropic wire format. `--ai-api openai` talks to
# DeepSeek, OpenRouter, Ollama and friends over stdlib urllib, with no SDK.
ai = ["anthropic>=0.69"]

[project.scripts]
# The distribution is 0xgitanalyzer (the plain name is taken on PyPI by an
# unrelated project); the import package stays `gitanalyzer`, and both
# commands start the same CLI.
"0xgitanalyzer" = "gitanalyzer.cli:main"
gitanalyzer = "gitanalyzer.cli:main"

[project.urls]
Source = "https://github.com/OliveXSecurity/0xGitAnalyzer"
Issues = "https://github.com/OliveXSecurity/0xGitAnalyzer/issues"

[tool.setuptools]
packages = ["gitanalyzer"]

[tool.setuptools.package-data]
gitanalyzer = ["web/*.html", "web/*.css", "web/*.js"]
